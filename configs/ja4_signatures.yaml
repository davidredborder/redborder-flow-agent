# ==============================================================================
# redborder-flow-agent - JA4 Fingerprint Signature Database & Rules
# ==============================================================================
#
# ABOUT JA4 FINGERPRINTING & COMMERCIAL DATABASES:
# ------------------------------------------------------------------------------
# JA4 is an open fingerprinting standard created by John Althouse / FoxIO.
# Format: [Part_A]_[Part_B]_[Part_C]
#   - Part A: Protocol (t=TCP, q=QUIC) + TLS version + SNI type (d=domain, i=IP/none)
#             + Cipher count (2 digits) + Extension count (2 digits) + ALPN (h2, h1, 00)
#   - Part B: Truncated SHA-256 hash of sorted cipher suites (12 hex chars)
#   - Part C: Truncated SHA-256 hash of sorted extensions & signature algorithms (12 hex chars)
#
# NOTE ON COMMERCIAL / ENTERPRISE FEEDS:
# FoxIO provides an official commercial database (JA4DB) containing tens of thousands
# of verified enterprise, malware, and application fingerprints updated in real-time.
# If your organization requires full enterprise JA4 threat intelligence feeds,
# refer to:
#   - Official FoxIO JA4 Project: https://github.com/FoxIO-LLC/ja4
#   - FoxIO JA4 Database & Enterprise Licensing: https://foxio.io/ja4-database/
#
# This file provides a curated open-source collection of common browsers, developer
# runtimes, CLI tools, automated scrapers, scanners, and known threat/C2 profiles.
# You can freely add, modify, or extend these rules for your network environment.
# ==============================================================================

